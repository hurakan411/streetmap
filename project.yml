name: Michi
options:
  bundleIdPrefix: jp.michi
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  Michi:
    type: application
    platform: iOS
    sources:
      - path: Michi
        excludes:
          - Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.michi.walkmap
        PRODUCT_NAME: Michi
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_FILE: Michi/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      testTargets: []
